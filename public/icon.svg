<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="citrineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A82F"/>
      <stop offset="50%" stop-color="#2A7B76"/>
      <stop offset="100%" stop-color="#144643"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DE87"/>
      <stop offset="100%" stop-color="#D4A82F"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#citrineGrad)"/>
  
  <!-- Outer glowing hexagon / diamond frame -->
  <path d="M 256 70 L 416 162 L 416 350 L 256 442 L 96 350 L 96 162 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="12" 
        stroke-linejoin="round"/>
        
  <!-- Citrine faceted crystal polygon -->
  <polygon points="256,110 380,182 380,330 256,402 132,330 132,182" 
           fill="url(#gemGrad)" 
           opacity="0.95" 
           stroke="#ffffff" 
           stroke-width="6"/>
           
  <!-- Internal facet cuts -->
  <line x1="256" y1="110" x2="256" y2="402" stroke="#ffffff" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="132" y1="182" x2="380" y2="330" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5"/>
  <line x1="132" y1="330" x2="380" y2="182" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5"/>
  <polygon points="256,190 320,256 256,322 192,256" fill="#ffffff" fill-opacity="0.35"/>
  
  <!-- Stylized central 'C' letterform -->
  <path d="M 285 220 C 235 210 205 235 205 256 C 205 277 235 302 285 292" 
        fill="none" 
        stroke="#144643" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
