      name="description"
      content="Portail d'administration et de coordination des présences, des tâches, des alertes de rappel, des rapports automatisés et des appels audio/vidéo gratuits entre collègues."
    />
    <meta property="og:title" content="Citrine Management" />
    <meta
      property="og:description"
      content="Portail d'administration et de coordination des présences, des tâches, des alertes de rappel, des rapports automatisés et des appels audio/vidéo gratuits entre collègues."
    />
    <script>
      (function() {
        var isWsError = function(target) {
          if (!target) return false;
          var str = String(target.message || target.reason || target || '');
          return str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1;
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event && (event.reason || event))) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          if (isWsError(event && (event.error || event.message || event))) {
            event.preventDefault();
          }
        });

        // Capture native PWA install prompt before React mounts so Android/Windows/Mac/Linux never miss it
        window.__citrineDeferredPrompt = null;
        window.__citrinePwaInstalled = false;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__citrineDeferredPrompt = e;
          window.dispatchEvent(new CustomEvent('citrine:pwa-prompt-ready'));
        });
        window.addEventListener('appinstalled', function() {
          window.__citrinePwaInstalled = true;
          window.__citrineDeferredPrompt = null;
          window.dispatchEvent(new CustomEvent('citrine:pwa-installed'));
        });
      })();
    </script>
